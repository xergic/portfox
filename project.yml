name: Portfox
options:
  bundleIdPrefix: net.kandera
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PortfoxKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Portfox:
    type: application
    platform: macOS
    sources:
      - path: App/Portfox
        excludes:
          - Resources/Fonts
          - Resources/Portfox.icon
      # A folder reference, so ATSApplicationFontsPath finds Contents/Resources/Fonts.
      - path: App/Portfox/Resources/Fonts
        type: folder
      # An Icon Composer bundle. It is a directory, so it has to be named as a
      # single file or XcodeGen would walk into it and add its parts separately.
      - path: App/Portfox/Resources/Portfox.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: PortfoxKit
        product: PortfoxKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.kandera.Portfox
        PRODUCT_NAME: Portfox
        INFOPLIST_FILE: App/Portfox/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Portfox/Portfox.entitlements
        # Ad hoc signing keeps a local build free of a developer team.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        # proc_pidinfo and kill are unavailable inside the App Sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: Portfox
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
