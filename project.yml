name: PortFox
options:
  bundleIdPrefix: net.kandera
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PortFoxKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PortFox:
    type: application
    platform: macOS
    sources:
      - path: App/PortFox
        excludes:
          - Resources/Fonts
      # A folder reference, so ATSApplicationFontsPath finds Contents/Resources/Fonts.
      - path: App/PortFox/Resources/Fonts
        type: folder
    dependencies:
      - package: PortFoxKit
        product: PortFoxKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.kandera.PortFox
        PRODUCT_NAME: PortFox
        INFOPLIST_FILE: App/PortFox/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/PortFox/PortFox.entitlements
        # Ad hoc signing keeps a local build free of a developer team.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        # proc_pidinfo and kill are unavailable inside the App Sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
